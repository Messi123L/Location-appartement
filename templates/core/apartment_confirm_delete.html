{% extends 'base.html' %}

{% block title %}Supprimer l'appartement{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
    <h2>Confirmer la suppression</h2>
    <p>Êtes-vous sûr de vouloir supprimer l'appartement "{{ apartment.title }}" ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'apartment_list' %}" class="btn btn-primary">Annuler</a>
    </form>
</div>
{% endblock %}
