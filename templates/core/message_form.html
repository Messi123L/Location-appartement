{% extends 'base.html' %}

{% block title %}Nouveau Message{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto; padding: 2rem;">
    <h2>Nouveau Message</h2>
    {% if receiver %}
        <p>Destinataire: {{ receiver.username }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Envoyer</button>
    </form>
    <a href="{% url 'message_list' %}" class="btn btn-primary" style="margin-top: 1rem;">Annuler</a>
</div>
{% endblock %}
