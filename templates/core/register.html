{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
    <h2>Inscription</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">S'inscrire</button>
    </form>
    <p style="margin-top: 1rem;">Déjà un compte ? <a href="{% url 'login' %}">Connectez-vous</a></p>
</div>
{% endblock %}
