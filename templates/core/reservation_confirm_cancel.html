{% extends 'base.html' %}

{% block title %}Annuler la Réservation{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
    <h2>Confirmer l'annulation</h2>
    <p>Êtes-vous sûr de vouloir annuler votre réservation pour "{{ reservation.apartment.title }}" ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, annuler</button>
        <a href="{% url 'reservation_history' %}" class="btn btn-primary">Retour</a>
    </form>
</div>
{% endblock %}
