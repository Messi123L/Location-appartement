{% extends 'base.html' %}

{% block title %}Réserver {{ apartment.title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto; padding: 2rem;">
    <h2>Réserver: {{ apartment.title }}</h2>
    <p><strong>Prix par nuit:</strong> {{ apartment.price_per_night }}€</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Confirmer la réservation</button>
    </form>
    <a href="{% url 'apartment_detail' apartment.pk %}" class="btn btn-primary" style="margin-top: 1rem;">Annuler</a>
</div>
{% endblock %}
